<title>HK416 Part Viewer</title>
<style>
  .hkv { --bg:#14161a; --panel:#1c1f25; --line:#2c313a; --text:#e6e8ec; --dim:#98a0ad; --acc:#7fb4ff; --ok:#5fd08a; --bad:#ff7a7a;
         font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg);
         display: grid; grid-template-columns: 250px minmax(0, 1fr) 330px; grid-template-rows: 100vh; position: fixed; inset: 0; }
  .hkv * { box-sizing: border-box; }
  .hkv aside { background: var(--panel); overflow-y: auto; padding: 12px; border-right: 1px solid var(--line); }
  .hkv aside.right { border-right: 0; border-left: 1px solid var(--line); }
  .hkv h1 { font-size: 15px; margin: 0 0 2px; } .hkv h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
  .hkv .sub { color: var(--dim); margin-bottom: 8px; }
  .hkv main { position: relative; min-width: 0; } .hkv canvas { display: block; width: 100%; height: 100%; }
  .hkv button { font: inherit; color: var(--text); background: #262a32; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  .hkv button:hover { border-color: var(--acc); } .hkv button.on { background: var(--acc); color: #0b1220; border-color: var(--acc); }
  .hkv .row { display: flex; flex-wrap: wrap; gap: 6px; } .hkv input[type=range] { width: 100%; }
  .hkv details { border-bottom: 1px solid var(--line); } .hkv summary { cursor: pointer; padding: 5px 0; font-weight: 600; }
  .hkv summary span { color: var(--dim); font-weight: 400; }
  .hkv .part { padding: 2px 6px; border-radius: 4px; cursor: pointer; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hkv .part:hover { color: var(--text); background: #262a32; } .hkv .part.sel { color: #0b1220; background: var(--acc); }
  .hkv table { width: 100%; border-collapse: collapse; } .hkv td, .hkv th { text-align: left; padding: 4px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .hkv th { color: var(--dim); font-weight: 500; } .hkv .ok { color: var(--ok); font-weight: 600; } .hkv .bad { color: var(--bad); font-weight: 600; }
  .hkv .hud { position: absolute; left: 12px; bottom: 12px; background: rgba(20,22,26,.8); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 60%; }
  .hkv .bar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hkv .note { color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) { .hkv { grid-template-columns: 1fr; grid-template-rows: 60vh auto auto; position: static; } .hkv aside { border: 0; } }
</style>
<div class="hkv">
  <aside>
    <h1>HK416 D14.5RS</h1><div class="sub" id="counts">loading ./hk416.glb</div>
    <input id="q" placeholder="Filter parts" style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#111318;color:inherit">
    <h2>Parts by region</h2><div id="tree"></div>
  </aside>
  <main>
    <canvas id="c"></canvas>
    <div class="bar">
      <button id="spin" class="on">Turntable</button><button id="reset">Reset view</button><button id="rest">Rest pose</button>
      <label style="display:flex;align-items:center;gap:6px;background:rgba(20,22,26,.8);padding:4px 8px;border-radius:6px;border:1px solid var(--line)">Exploded <input id="explode" type="range" min="0" max="1" step="0.01" value="0" style="width:140px"></label>
    </div>
    <div class="hud" id="hud">Click a part in the list or on the model.</div>
  </main>
  <aside class="right">
    <h2>Animation clips</h2><div class="row" id="clips"></div>
    <h2>Checks</h2><div id="checks"></div>
    <h2>Silhouette rounds</h2><div id="rounds"></div>
    <h2>Triangles</h2><div id="tris"></div>
  </aside>
</div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const canvas = $('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x23262c);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1, 1.5, 1); scene.add(key);
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 20); const home = new THREE.Vector3(-0.75, 0.28, 0.75);
camera.position.copy(home);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, -0.03, 0); controls.enableDamping = true;
function size() { const r = canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
// exploded view: each region slides along its assembly direction (three.js axes: x = left side, y = up, z = muzzle)
const EXPLODE = { upper: [0, .07, 0], lower: [0, -.03, 0], handguard: [0, .07, .10], barrel_assembly: [0, .07, .30], stock: [0, -.03, -.14], grip: [0, -.11, -.03],
                  magazine: [0, -.16, .02], sights: [0, .17, 0], controls: [.09, -.03, 0], fasteners: [-.09, -.03, 0] };
let mixer, actions = {}, groups = {}, meshes = [], selected = null, spin = true; const rest = new Map();
const hi = new THREE.Color(0x3d7dff);
function select(m) {
  if (selected) { selected.material = selected.userData.mat; document.querySelectorAll('.part.sel').forEach(e => e.classList.remove('sel')); }
  selected = m; if (!m) { $('hud').textContent = 'Click a part in the list or on the model.'; return; }
  m.userData.mat = m.userData.mat || m.material; const c = m.userData.mat.clone(); c.emissive = hi; c.emissiveIntensity = 0.6; m.material = c;
  const el = document.querySelector(`.part[data-n="${m.name}"]`); if (el) { el.classList.add('sel'); el.closest('details').open = true; el.scrollIntoView({ block: 'nearest' }); }
  const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()).multiplyScalar(1000);
  $('hud').innerHTML = `<b>${m.name}</b> &nbsp; region: ${m.userData.region} &nbsp; ${m.geometry.index ? m.geometry.index.count / 3 : m.geometry.attributes.position.count / 3} triangles<br><span class="note">size ${s.z.toFixed(1)} x ${s.x.toFixed(1)} x ${s.y.toFixed(1)} mm (length, width, height) &nbsp; material: ${m.userData.mat.name}</span>`;
}
new GLTFLoader().load('./hk416.glb', g => {
  scene.add(g.scene); const root = g.scene.getObjectByName('HK416') || g.scene;
  root.children.forEach(grp => { groups[grp.name] = grp; rest.set(grp, grp.position.clone());
    grp.traverse(o => { if (o.isMesh) { o.userData.region = grp.name; meshes.push(o); } }); });
  $('counts').textContent = `${meshes.length} parts, ${(DATA.lod0.triangles || 0).toLocaleString()} triangles (LOD0)`;
  const tree = $('tree');
  Object.keys(groups).forEach(n => { const ms = meshes.filter(m => m.userData.region === n).sort((a, b) => a.name.localeCompare(b.name)); if (!ms.length) return;
    const d = document.createElement('details'); d.innerHTML = `<summary>${n} <span>${ms.length}</span></summary>`;
    ms.forEach(m => { const e = document.createElement('div'); e.className = 'part'; e.dataset.n = m.name; e.textContent = m.name; e.onclick = () => select(m); d.appendChild(e); }); tree.appendChild(d); });
  mixer = new THREE.AnimationMixer(g.scene);
  g.animations.forEach(clip => { const a = mixer.clipAction(clip); a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; actions[clip.name] = a;
    const b = document.createElement('button'); b.textContent = clip.name; b.title = clip.duration.toFixed(2) + ' s';
    b.onclick = () => { Object.values(actions).forEach(x => x.stop()); document.querySelectorAll('#clips button').forEach(x => x.classList.remove('on')); b.classList.add('on'); a.reset().play(); };
    $('clips').appendChild(b); });
}, undefined, e => { $('counts').innerHTML = '<span class="bad">Could not load ./hk416.glb. Serve this folder over http (python3 -m http.server).</span>'; });
$('q').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('.part').forEach(p => p.style.display = p.dataset.n.includes(q) ? '' : 'none'); document.querySelectorAll('#tree details').forEach(d => d.open = !!q); };
$('spin').onclick = e => { spin = !spin; e.target.classList.toggle('on', spin); };
$('reset').onclick = () => { camera.position.copy(home); controls.target.set(0, -0.03, 0); };
$('rest').onclick = () => { Object.values(actions).forEach(x => x.stop()); document.querySelectorAll('#clips button').forEach(x => x.classList.remove('on')); $('explode').value = 0; explode(0); select(null); };
function explode(t) { for (const [n, v] of Object.entries(EXPLODE)) { const g = groups[n]; if (g) g.position.copy(rest.get(g)).add(new THREE.Vector3(...v).multiplyScalar(t)); } }
$('explode').oninput = e => explode(+e.target.value);
const ray = new THREE.Raycaster(); let down = null;
canvas.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const h = ray.intersectObjects(meshes, false)[0]; select(h ? h.object : null); });
// ---- check results (embedded when the page was generated)
const ok = v => v ? '<span class="ok">pass</span>' : '<span class="bad">not met</span>';
const C = DATA.checks || {}, S = DATA.score || {};
const rows = [];
if (C.inventory) rows.push(['Inventory coverage', `${(C.inventory.coverage * 100).toFixed(0)}% of ${C.inventory.features} features, ${C.inventory.merged_features} merged`, C.inventory.passed]);
if (S.right_photo) rows.push(['Silhouette: right photo', `IoU ${S.right_photo.iou.toFixed(3)} (target 0.92)`, S.right_photo.iou >= 0.92]);
if (S.drawing_right) rows.push(['Silhouette: drawing, right', `IoU ${S.drawing_right.iou.toFixed(3)} (target 0.92; photo vs drawing ${S.reference_ceiling_photo_vs_drawing_right.toFixed(3)})`, S.drawing_right.iou >= 0.92]);
if (S.drawing_left) rows.push(['Silhouette: drawing, left', `IoU ${S.drawing_left.iou.toFixed(3)} (target 0.92; photo vs drawing ${S.reference_ceiling_photo_vs_drawing_left.toFixed(3)})`, S.drawing_left.iou >= 0.92]);
if (DATA.closeups && DATA.closeups.length) rows.push(['Close-up review', `${DATA.closeups.length} close-ups compared, differences listed in NOTES.md`, true]);
if (C.assembly) rows.push(['Assembly', `${C.assembly.parts} parts, ${C.assembly.floating.length} floating, ${C.assembly.fasteners_not_seated.length} of ${C.assembly.fasteners} fasteners unseated`, C.assembly.passed]);
if (C.animation) Object.entries(C.animation.clips).forEach(([n, c]) => rows.push([`Clip: ${n}`, `${c.seconds} s, ${c.moving_parts} parts move, deepest overlap ${c.worst_penetration.depth_mm} mm (limit 0.2)`, c.passed]));
if (C.export) rows.push(['Export reload', `${C.export.reloaded.objects} objects, ${C.export.reloaded.materials} materials, ${C.export.images} embedded images, barrel ${C.export.barrel_length_in} in`, C.export.passed]);
$('checks').innerHTML = '<table>' + rows.map(r => `<tr><td>${r[0]}<div class="note">${r[1]}</div></td><td>${ok(r[2])}</td></tr>`).join('') + '</table>';
$('rounds').innerHTML = '<table><tr><th>#</th><th>Photo</th><th>Draw R</th><th>Draw L</th></tr>' + (DATA.rounds || []).map(r => `<tr title="${r.change.replace(/"/g, '&quot;')}"><td>${r.round}</td><td>${r.iou_right_photo.toFixed(3)}</td><td>${r.iou_drawing_right.toFixed(3)}</td><td>${r.iou_drawing_left.toFixed(3)}</td></tr>`).join('') + '</table><div class="note">Hover a row for the change made that round.</div>';
const L0 = DATA.lod0 || {}, L1 = DATA.lod1 || {};
$('tris').innerHTML = '<table><tr><th>Region</th><th>LOD0</th><th>LOD1</th></tr>' + Object.keys(L0.by_region || {}).map(k => `<tr><td>${k}</td><td>${L0.by_region[k].toLocaleString()}</td><td>${((L1.by_region || {})[k] || 0).toLocaleString()}</td></tr>`).join('') +
  `<tr><td><b>Total</b></td><td><b>${(L0.triangles || 0).toLocaleString()}</b></td><td><b>${(L1.triangles || 0).toLocaleString()}</b></td></tr></table>`;
const clock = new THREE.Clock();
(function loop() { requestAnimationFrame(loop); const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.autoRotate = spin; controls.autoRotateSpeed = 1.2; controls.update(); renderer.render(scene, camera); })();
</script>
